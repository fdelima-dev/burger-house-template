<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger House</title>
    <link rel="stylesheet" href="build/styles/main.min.css" />
</head>
<body>
    <header>
        <div class="container">
            <div class="container__brand">
                <img src="build/images/logo.png" alt="Logo Burger House">
            </div>
            <div class="container__menu">
                <ul class="container__menu__list">
                    <li class="container__menu__list__item">
                        <a href="#">
                            Inicio
                        </a>
                    </li>
                    <li class="container__menu__list__item">
                        <a href="#">
                            Cardápio
                        </a>
                    </li>
                    <li class="container__menu__list__item">
                        <a href="#">
                            Sobre
                        </a>
                    </li>
                    <li class="container__menu__list__item">
                        <a href="#">
                            Avaliações
                        </a>
                    </li>
                    <li class="container__menu__list__item">
                        <a href="#">
                            Contato
                        </a>
                    </li>
                </ul>
            </div>
            <div class="container__btnPedido">
                <button class="btnSite">Faça seu pedido</button>
            </div>
        </div>
    </header>
    <div class="hero">
        <div class="hero__container">
            <div class="hero__container__leftSide">
                <p class="intro">SABOR DE VERDADE</p>
                <h2>O MELHOR<br />
                    <span class="fonteTema">HAMBURGER</span><br />
                    DA CIDADE
                </h2>
                <p>Ingredientes selecionados, carnes suculentas
                    <br />e um sabor que vai fazer voce volar sempre!</p>
                    <br />
                    <button><img src="build/images/restaurant.png" alt="Garfo" />VER CADAPIO</button>
            </div>
            <div class="hero__container__rightSide">
                
            </div>
        </div>
    </div>
</body>
</html>
